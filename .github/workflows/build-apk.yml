name: Build Pixel 9 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug & Release APK
        run: gradle assembleDebug assembleRelease

      - name: Upload Pixel 9 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixel9-SitcomWidget-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to repo root for instant curl + adb install
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk sitcom-laughs-pixel9.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitcom-laughs-pixel9.apk
          git diff --cached --quiet || (git commit -m "chore: update compiled sitcom-laughs-pixel9.apk [skip ci]" && git push)
