<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#141218" />
  <title>😂 Risas Enlatadas • Pixel 9</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: #141218;
      color: #e6e0e9;
      font-family: system-ui, -apple-system, 'Google Sans', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #211f26;
      border-radius: 36px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0,0,0,0.45);
      border: 1px solid rgba(233, 221, 255, 0.1);
    }
    .badge {
      display: inline-block;
      background: #332f37;
      color: #d0bcff;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 700;
      color: #f5eff7;
    }
    p {
      margin: 0 0 28px;
      font-size: 13px;
      color: #cac4d0;
    }
    .laugh-btn {
      width: 100%;
      height: 170px;
      border: none;
      border-radius: 32px;
      background: #e9ddff;
      color: #22005d;
      font-size: 24px;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.12s cubic-bezier(0.2, 0, 0, 1), background 0.2s;
      box-shadow: 0 10px 25px rgba(208, 188, 255, 0.22);
    }
    .laugh-btn:active, .laugh-btn.playing {
      transform: scale(0.95);
      background: #d0bcff;
    }
    .laugh-btn .emoji {
      font-size: 58px;
      line-height: 1;
    }
    .stop-btn {
      margin-top: 14px;
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 20px;
      background: #332f37;
      color: #e8def8;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .stop-btn:active { transform: scale(0.97); }
    .install-btn {
      margin-top: 18px;
      width: 100%;
      height: 48px;
      border: 1px solid #49454f;
      border-radius: 20px;
      background: transparent;
      color: #d0bcff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge" id="status">Pixel 9 Material You ✨</span>
    <h1>Risas Enlatadas</h1>
    <p>Hecho con mucho amor por tu Wendy 🤍🃏</p>

    <button class="laugh-btn" id="playBtn">
      <span class="emoji">😂</span>
      <span>¡JAJAJAJA!</span>
    </button>

    <button class="stop-btn" id="stopBtn">⏹️ Callar al público</button>
    <button class="install-btn" id="installBtn">📌 Instalar en Pantalla Principal</button>
  </div>

  <audio id="audio" src="sitcom_laugh.mp3" preload="auto"></audio>

  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const status = document.getElementById('status');
    const installBtn = document.getElementById('installBtn');

    function triggerLaugh() {
      audio.currentTime = 0;
      audio.play().then(() => {
        playBtn.classList.add('playing');
        status.textContent = '🔊 Sonando risas del público...';
      }).catch(() => {});
    }

    playBtn.addEventListener('click', triggerLaugh);

    stopBtn.addEventListener('click', () => {
      audio.pause();
      audio.currentTime = 0;
      playBtn.classList.remove('playing');
      status.textContent = 'Pixel 9 Material You ✨';
    });

    audio.addEventListener('ended', () => {
      playBtn.classList.remove('playing');
      status.textContent = 'Pixel 9 Material You ✨';
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = 'none';
    });
  </script>
</body>
</html>
